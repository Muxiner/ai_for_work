<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>在线简历编辑器</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/templates.css" />
<link rel="stylesheet" href="/css/timeline.css" />
<link rel="stylesheet" href="/css/print.css" />
</head>
<body class="editing" data-template="classic">
  <div class="toolbar">
    <div class="brand"><span class="dot"></span>在线简历编辑器</div>

    <div class="menu panel-menu" id="fileMenu">
      <button class="btn ghost menu-btn">简历</button>
      <div class="menu-panel">
        <div class="panel-title">简历</div>
        <div class="file-list" id="fileList"></div>
        <div class="row">
          <button class="btn ghost" id="newFileBtn">新建</button>
          <button class="btn ghost" id="renameFileBtn">重命名</button>
          <button class="btn ghost" id="delFileBtn">删除</button>
        </div>
        <div class="panel-title">示例（点击预览）</div>
        <div class="file-list" id="sampleList"></div>
        <div class="row">
          <button class="btn ghost" id="restoreBackupBtn">恢复备份</button>
        </div>
      </div>
    </div>

    <div class="menu panel-menu">
      <button class="btn ghost menu-btn">样式</button>
      <div class="menu-panel">
        <label class="ctl">模板
          <select id="tplSelect">
            <option value="classic">经典</option>
            <option value="modern">现代</option>
            <option value="tech">科技</option>
            <option value="gradient">渐变</option>
            <option value="minimal">极简</option>
            <option value="center">居中</option>
            <option value="card">卡片</option>
            <option value="compact">紧凑</option>
            <option value="elegant">优雅</option>
            <option value="sidebar">侧边栏</option>
          </select>
        </label>
        <label class="ctl">英文
          <select id="fontLatin">
            <option value="system">系统默认</option>
            <option value="times">Times New Roman</option>
            <option value="georgia">Georgia</option>
            <option value="garamond">Garamond</option>
            <option value="cambria">Cambria</option>
            <option value="calibri">Calibri</option>
            <option value="arial">Arial</option>
            <option value="helvetica">Helvetica</option>
            <option value="verdana">Verdana</option>
            <option value="tahoma">Tahoma</option>
            <option value="courier">Courier New</option>
            <option value="consolas">Consolas</option>
            <option value="custom" hidden>自定义字体</option>
          </select>
        </label>
        <label class="ctl">中文
          <select id="fontCJK">
            <option value="system">系统默认</option>
            <option value="yahei">微软雅黑</option>
            <option value="pingfang">苹方</option>
            <option value="sourcehan">思源黑体</option>
            <option value="heiti">黑体</option>
            <option value="simsun">宋体</option>
            <option value="sourceserif">思源宋体</option>
            <option value="kai">楷体</option>
            <option value="fangsong">仿宋</option>
            <option value="custom" hidden>自定义字体</option>
          </select>
        </label>
        <div class="row">
          <button class="btn ghost" id="fontUploadBtn" title="上传 .ttf/.otf/.woff/.woff2，导出 PDF 时嵌入">字体文件</button>
          <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/*" hidden />
        </div>
        <div class="panel-title">配色</div>
        <div class="swatches" id="swatches"></div>
        <label class="color-custom" title="自定义颜色">
          <span class="color-custom-ring"><input type="color" id="accentPicker" class="accent-picker" /></span>
          <span>自定义颜色</span>
        </label>
        <div class="size-group">
          <div class="size-row"><label>一级</label><input type="range" id="szL1" min="10" max="22" step="0.5" /><span class="size-val" id="szL1v"></span></div>
          <div class="size-row"><label>二级</label><input type="range" id="szL2" min="9" max="20" step="0.5" /><span class="size-val" id="szL2v"></span></div>
          <div class="size-row"><label>三级</label><input type="range" id="szL3" min="8" max="18" step="0.5" /><span class="size-val" id="szL3v"></span></div>
          <div class="size-row"><label>姓名</label><input type="range" id="szName" min="18" max="40" step="1" /><span class="size-val" id="szNamev"></span></div>
          <div class="size-row"><label>职位</label><input type="range" id="szRole" min="10" max="22" step="0.5" /><span class="size-val" id="szRolev"></span></div>
          <div class="size-row"><label>联系</label><input type="range" id="szContact" min="9" max="16" step="0.5" /><span class="size-val" id="szContactv"></span></div>
        </div>
      </div>
    </div>

    <div class="menu panel-menu">
      <button class="btn ghost menu-btn">时间轴</button>
      <div class="menu-panel">
        <div class="row">
          <button class="btn ghost" id="timelineToggle">时间轴排版</button>
        </div>
        <div class="chips" id="timelineTypes"></div>
        <label class="ctl" id="tlLineCtl">线条
          <select id="tlLine">
            <option value="solid">实线</option>
            <option value="dashed">虚线</option>
            <option value="dotted">点线</option>
            <option value="none">无</option>
          </select>
        </label>
        <label class="ctl" id="tlNodeCtl">节点
          <select id="tlNode">
            <option value="dot">圆点</option>
            <option value="arrow">箭头</option>
            <option value="square">方块</option>
            <option value="diamond">菱形</option>
            <option value="none">无</option>
          </select>
        </label>
        <label class="ctl" id="tlLayoutCtl">布局
          <select id="tlLayout">
            <option value="right">标题左·日期右</option>
            <option value="dateLeft">日期左置</option>
            <option value="stacked">日期在上</option>
            <option value="card">卡片</option>
          </select>
        </label>
      </div>
    </div>

    <div class="menu panel-menu">
      <button class="btn ghost menu-btn">显示</button>
      <div class="menu-panel">
        <button class="btn ghost" id="panelToggle">项目列表</button>
        <button class="btn ghost" id="kwToggle">隐藏关键词</button>
        <button class="btn ghost" id="photoToggle">隐藏照片</button>
        <button class="btn ghost" id="toggleEdit">预览模式</button>
      </div>
    </div>

    <span class="save-state" id="saveState">加载中…</span>

    <label class="ctl">导出
      <select id="exportFormat">
        <option value="pdf">PDF</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </label>
    <button class="btn primary" id="exportBtn">导出</button>
  </div>

  <aside class="side-panel" id="sidePanel">
    <div class="side-head">
      <span>显示项目</span>
      <button class="side-close" id="sideClose" title="收起">×</button>
    </div>
    <div class="side-list" id="sideList"></div>
  </aside>

  <div class="stage">
    <div class="preview-banner" id="previewBanner" hidden>
      <span class="preview-text">示例预览：<b id="previewName"></b> · 只读，不会修改你的简历</span>
      <button class="btn primary" id="dupSampleBtn">基于示例新建</button>
      <button class="btn ghost" id="exitPreviewBtn">返回我的简历</button>
    </div>
    <main class="page" id="page"></main>
    <p class="hint" id="hint">所有内容均可直接点击编辑 · 点击照片框可上传大头照 · 文本保存在 docs/ 目录 · 导出 PDF 时选择「另存为 PDF」</p>
  </div>

  <script type="text/markdown" id="defaultResume">

  <script type="module" src="/js/app.js"></script>
</body>
</html>
